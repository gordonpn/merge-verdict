version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    # Match engines.node (>=22.12.0) per docs/decisions.md so newer Node APIs do not enter types.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=22.13.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      pnpm-action-setup:
        patterns:
          - "pnpm/action-setup"
