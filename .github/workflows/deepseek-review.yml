name: DeepSeek Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: runner / deepseek-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
      cancel-in-progress: true
    # Secrets are not available to pull_request events from forks; restrict to same-repository PRs.
    if: |
      github.event.sender.type != 'Bot' &&
      github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         github.event.issue.state == 'open' &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
         contains(github.event.comment.body, '/review')))
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Check PR draft status for comment triggers
        id: pr_state
        if: github.event_name == 'issue_comment' && env.DEEPSEEK_API_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          is_draft="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.draft')"
          echo "is_draft=${is_draft}" >> "${GITHUB_OUTPUT}"

      - name: Checkout review prompt
        if: env.DEEPSEEK_API_KEY != '' && (github.event_name != 'issue_comment' || steps.pr_state.outputs.is_draft == 'false')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/prompts/deepseek-review.md
          sparse-checkout-cone-mode: false

      - name: Read review prompt
        if: env.DEEPSEEK_API_KEY != '' && (github.event_name != 'issue_comment' || steps.pr_state.outputs.is_draft == 'false')
        id: prompt
        run: |
          python3 - <<'PYTHON'
          import os
          import uuid
          from pathlib import Path

          prompt = Path(".github/prompts/deepseek-review.md").read_text(encoding="utf-8")
          delimiter = uuid.uuid4().hex
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"text<<{delimiter}\n{prompt}\n{delimiter}\n")
          PYTHON

      - name: DeepSeek Code Review
        if: env.DEEPSEEK_API_KEY != '' && (github.event_name != 'issue_comment' || steps.pr_state.outputs.is_draft == 'false')
        uses: hustcer/deepseek-review@v1
        with:
          chat-token: ${{ secrets.DEEPSEEK_API_KEY }}
          sys-prompt: ${{ steps.prompt.outputs.text }}
          watch-mention: "/review"
