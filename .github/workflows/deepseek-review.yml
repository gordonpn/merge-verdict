name: DeepSeek Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: runner / deepseek-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
      cancel-in-progress: true
    # Secrets are not available to pull_request events from forks; exclude fork, bot, and Dependabot PRs.
    if: |
      vars.ENABLE_DEEPSEEK_REVIEW == 'true' &&
      github.event.sender.type != 'Bot' &&
      github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.user.type != 'Bot' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         github.event.issue.state == 'open' &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
         contains(github.event.comment.body, '/review')))
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Check PR eligibility for comment triggers
        id: pr_state
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          eligible="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | jq -r --arg repo "${GITHUB_REPOSITORY}" '
            (.draft == false) and
            ((.head.repo.full_name // "") == $repo) and
            ((.user.type // "") != "Bot") and
            ((.user.login // "") != "dependabot[bot]")
          ')"
          echo "eligible=${eligible}" >> "${GITHUB_OUTPUT}"

      - name: Validate reviewer credentials
        if: github.event_name != 'issue_comment' || steps.pr_state.outputs.eligible == 'true'
        run: |
          if [ -z "${DEEPSEEK_API_KEY//[[:space:]]/}" ]; then
            echo "::error::DEEPSEEK_API_KEY is missing, empty, or whitespace-only while ENABLE_DEEPSEEK_REVIEW is enabled."
            exit 1
          fi

      - name: Checkout review prompt
        if: github.event_name != 'issue_comment' || steps.pr_state.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/prompts/deepseek-review.md
          sparse-checkout-cone-mode: false

      - name: Read review prompt
        if: github.event_name != 'issue_comment' || steps.pr_state.outputs.eligible == 'true'
        id: prompt
        run: |
          python3 - <<'PYTHON'
          import os
          import uuid
          from pathlib import Path

          prompt = Path(".github/prompts/deepseek-review.md").read_text(encoding="utf-8")
          delimiter = uuid.uuid4().hex
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"text<<{delimiter}\n{prompt}\n{delimiter}\n")
          PYTHON

      - name: DeepSeek Code Review
        id: deepseek_review
        if: github.event_name != 'issue_comment' || steps.pr_state.outputs.eligible == 'true'
        uses: hustcer/deepseek-review@v1
        with:
          chat-token: ${{ secrets.DEEPSEEK_API_KEY }}
          sys-prompt: ${{ steps.prompt.outputs.text }}
          watch-mention: "/review"

      - name: Write issue_comment review target metadata
        if: github.event_name == 'issue_comment' && steps.pr_state.outputs.eligible == 'true' && steps.deepseek_review.outcome == 'success'
        env:
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          TARGET_PATH: ${{ runner.temp }}/deepseek-review-target.json
        run: |
          jq -n \
            --arg workflow_path ".github/workflows/deepseek-review.yml" \
            --arg run_id "${RUN_ID}" \
            --arg repository "${REPOSITORY}" \
            --arg pr_number "${PR_NUMBER}" \
            '{
              schema_version: 1,
              workflow_path: $workflow_path,
              run_id: ($run_id | tonumber),
              repository: $repository,
              pull_request_number: ($pr_number | tonumber)
            }' > "${TARGET_PATH}"

      - name: Upload issue_comment review target artifact
        if: github.event_name == 'issue_comment' && steps.pr_state.outputs.eligible == 'true' && steps.deepseek_review.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deepseek-review-target-pr-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/deepseek-review-target.json
          retention-days: 7
          if-no-files-found: error
