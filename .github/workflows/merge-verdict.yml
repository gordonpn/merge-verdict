name: merge-verdict

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Pull request number to evaluate"
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited]
  check_run:
    types: [completed]

concurrency:
  group: merge-verdict-${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number || github.event.check_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read

jobs:
  evaluate:
    name: runner / merge-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.actor != 'merge-verdict[bot]' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) &&
      (github.event_name != 'check_run' ||
        (github.event.check_run.name != 'merge-verdict' &&
         github.event.check_run.pull_requests[0].number != null &&
         github.event.check_run.pull_requests[1] == null))
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build action bundle
        run: pnpm run build

      - name: Run Merge Verdict
        id: merge-verdict
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ inputs.pull_request_number }}
